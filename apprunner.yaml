version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: python -m homeguard.dashboard
  network:
    port: 8000
    env: APP_PORT
  env:
    - name: HOMEGUARD_HOST
      value: "0.0.0.0"
    - name: HOMEGUARD_PORT
      value: "8000"
    - name: HOMEGUARD_AUDIT_LOG_PATH
      value: "audit_log.jsonl"
